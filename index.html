<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metvisor · ICON-EU</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map"></div>
  <aside id="panel">
    <h1>Metvisor</h1>
    <label>Variable
      <select id="variable"></select>
    </label>
    <label>Hora (UTC): <output id="timeLabel">–</output>
      <input id="timeSlider" type="range" min="0" max="0" value="0">
    </label>
    <div id="legend"></div>
    <p id="status">Cargando…</p>
    <small>Datos: modelo ICON-EU (DWD) vía <a href="https://open-meteo.com">Open-Meteo</a> (CC BY 4.0)</small>
  </aside>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
