name: Build data and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # ICON-EU publica cada pasada (00/06/12/18 UTC) unas 4 h después.
    - cron: '45 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Tests del pipeline
        run: python -m unittest discover -s pipeline/tests -t .
      - name: Generar datos ICON-EU
        # Si falla (p. ej. el DWD aún no ha publicado), se despliega la web con datos de muestra.
        continue-on-error: true
        run: python -m pipeline.build --out web/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
