<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metvisor · Península Ibérica</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar" aria-label="Variables">
    <div class="brand">Metvisor</div>
    <div id="modelPill" class="pill">–</div>
    <nav id="vars"></nav>
    <p class="credit">Datos: Deutscher Wetterdienst (ICON-EU)<br>Mapa: © OpenStreetMap</p>
  </aside>

  <div id="stage">
    <div id="map"></div>
    <button id="menuBtn" type="button" aria-label="Variables" aria-controls="sidebar" aria-expanded="false">☰</button>
    <div id="timeChip" class="chip mono">–</div>
    <div id="sampleBadge" class="chip" hidden>Datos de muestra</div>
    <div id="legend" class="panel">
      <div id="legendTitle" class="mono"></div>
      <div id="legendBar"></div>
      <div id="legendTicks" class="mono"></div>
    </div>
    <div id="timebar" class="panel">
      <div class="row">
        <button id="play" type="button" aria-label="Reproducir">▶</button>
        <input id="slider" type="range" min="0" max="0" value="0" aria-label="Hora de la previsión">
        <span id="lead" class="mono">+0 h</span>
      </div>
      <div id="days" class="mono"></div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="js/sample.js"></script>
  <script src="app.js"></script>
</body>
</html>
