<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Metvisor · Península Ibérica</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar" aria-label="Variables">
    <div class="side-top"><div class="brand">Metvisor</div><button id="menuClose" type="button" aria-label="Cerrar menú">✕</button></div>
    <div id="modelPill" class="pill">–</div>
    <div id="freshness" class="fresh" hidden></div>
    <nav id="vars"></nav>
    <h3 class="side-h">Capas</h3>
    <label id="isoRow" class="check" hidden><input type="checkbox" id="isoToggle" checked> Isobaras</label>
    <label id="windRow" class="check" hidden><input type="checkbox" id="windToggle"> Viento animado</label>
    <label class="check"><input type="checkbox" id="borderToggle" checked> Fronteras y costas</label>
    <label class="check"><input type="checkbox" id="reliefToggle" checked> Relieve</label>
    <label class="side-sel">Fondo
      <select id="bgSelect"><option value="esri">Claro (Esri)</option><option value="osm">OpenStreetMap</option></select>
    </label>
    <h3 class="side-h">Región</h3>
    <nav id="regions"></nav>
    <p class="credit">Datos: Deutscher Wetterdienst (ICON-EU)<br>Mapa: © Esri / © OpenStreetMap<br>Relieve: Mapzen / AWS Terrain Tiles</p>
  </aside>

  <div id="stage">
    <div id="map" role="application" aria-label="Mapa meteorológico"></div>
    <div id="scrim"></div>
    <canvas id="isoCanvas" aria-hidden="true"></canvas>
    <canvas id="windCanvas" aria-hidden="true"></canvas>
    <button id="menuBtn" type="button" aria-label="Variables" aria-controls="sidebar" aria-expanded="false">☰</button>
    <div id="timeChip" class="chip mono">–</div>
    <div id="sampleBadge" class="chip" hidden>Datos de muestra</div>
    <div id="searchBox" class="panel">
      <input id="search" type="search" placeholder="Buscar lugar para el meteograma…" autocomplete="off" aria-label="Buscar lugar" aria-controls="results">
      <ul id="results" role="listbox" hidden></ul>
    </div>
    <div id="cursor" hidden></div>
    <div id="meteo" class="panel" hidden>
      <div class="mg-head"><strong id="mgTitle">Meteograma</strong><button id="mgClose" type="button" aria-label="Cerrar meteograma">✕</button></div>
      <div id="mgBody"></div>
      <div id="mgLegend"><span class="k-temp">Temperatura</span><span class="k-rain">Precipitación</span><span class="k-wind">Viento</span><span class="k-gust">Rachas</span></div>
      <small id="mgNote">Open-Meteo · ICON-EU. Pulsa en el gráfico para saltar a esa hora.</small>
    </div>
    <div id="legend" class="panel">
      <div id="legendTitle" class="mono"></div>
      <div id="legendBar"></div>
      <div id="legendTicks" class="mono"></div>
    </div>
    <div id="timebar" class="panel">
      <div class="row">
        <button id="play" type="button" aria-label="Reproducir">▶</button>
        <input id="slider" type="range" min="0" max="0" value="0" aria-label="Hora de la previsión">
        <span id="lead" class="mono">+0 h</span>
      </div>
      <div id="days" class="mono"></div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/valuegrid.js"></script>
  <script src="js/meteogram.js"></script>
  <script src="js/geocode.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/isolabels.js"></script>
  <script src="app.js"></script>
</body>
</html>
